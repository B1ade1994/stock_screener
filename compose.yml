name: stock_screener
x-rails: &rails
  build:
    context: .
    dockerfile: Dockerfile.dev
  env_file: .env
  environment: &env
    RAILS_ENV: development
    DATABASE_URL: postgres://stock_screener:stock_screener@db:5432/stock_screener_development
    QUEUE_DATABASE_URL: postgres://stock_screener:stock_screener@db:5432/stock_screener_development_queue
    TEST_DATABASE_URL: postgres://stock_screener:stock_screener@db:5432/stock_screener_test
  volumes:
    - .:/rails
  restart: unless-stopped
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stock_screener
      POSTGRES_PASSWORD: stock_screener
      POSTGRES_DB: stock_screener_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U stock_screener]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  web:
    <<: *rails
    command: bash -c 'rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0'
    ports:
      - '127.0.0.1:3002:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://localhost:3000/up]
      interval: 5s
      timeout: 5s
      retries: 30
  worker:
    <<: *rails
    command: bin/jobs
    depends_on:
      web:
        condition: service_healthy
  collector:
    image: node:22-bookworm-slim
    working_dir: /app
    command: node collector/run.mjs
    env_file: .env
    environment:
      SCREENER_URL: http://web:3000
      NODE_EXTRA_CA_CERTS: /app/certs/russiantrustedca.pem
    volumes:
      - ./collector:/app/collector:ro
      - ./config/certs:/app/certs:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
