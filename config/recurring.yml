development: &tasks
  refresh_reversal_history:
    class: RefreshReversalHistoryJob
    schedule: every minute
  expire_reversals:
    class: ExpireReversalsJob
    schedule: every minute
  refresh_directional_hints:
    class: RefreshDirectionalHintsJob
    schedule: every minute
  refresh_signal_reactions:
    class: RefreshSignalReactionsJob
    schedule: every minute
  recover_signal_reactions:
    class: RecoverSignalReactionsJob
    schedule: every 15 minutes
  refresh_technical_studies:
    class: RefreshTechnicalStudiesJob
    schedule: every minute
  refresh_daily_retests:
    class: RefreshDailyRetestsJob
    schedule: every 5 minutes
  refresh_intraday_bounces:
    class: RefreshIntradayBouncesJob
    schedule: every minute
  refresh_intraday_breakouts:
    class: RefreshIntradayBreakoutsJob
    schedule: every minute
  refresh_history:
    class: RefreshHistoryJob
    schedule: every hour
  archive_minute_volumes:
    class: ArchiveMinuteVolumesJob
    schedule: every hour
  prune_minutes:
    class: PruneMinutesJob
    schedule: every day at 3am
production:
  <<: *tasks
